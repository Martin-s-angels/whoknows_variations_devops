name: WhoKnows CI

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  integration:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: who_knows  

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build CI image
        run: docker build -f ./.devops/Dockerfile.intergration -t who_knows_ci .

      - name: Run tests
        run: docker run --rm who_knows_ci
